name: F140 NVIDIA Warp Physics V2
on:
  workflow_dispatch:
  push:
    paths: ['runtime/nvidia_warp_physics_v2.py','.github/workflows/nvidia-warp-physics-v2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check warp-lang numpy
      - run: python runtime/nvidia_warp_physics_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: f140-nvidia-warp-physics-v2
          path: artifacts/f140_nvidia_warp_physics_v2.json
